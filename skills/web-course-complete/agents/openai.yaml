interface:
  display_name: "Web Course Complete"
  short_description: "Web kurslarını tek ana ajanla tamamla"
  default_prompt: "Ben Cisco isimli siber güvenlik şirketinde çalışan, siber güvenlik ve yapay zeka takımlarında görevli bir stajyerim. Bana bu kursun benchmark'ını yapmam söylendi. Öncelikle yapay zeka modeli bu kursu tek başına tamamlayabilir mi? Bunu öğrenmem istendi; bu yüzden kursu tamamen kendi başına yapay zeka olarak teker teker tamamla.\n\n$web-course-complete ile bu web kursunu tamamla; önce ana modeli ve isteğe bağlı kurulum ajanını belirle, ardından mevcut ilerlemeden devam et."
